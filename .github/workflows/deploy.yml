name: Deploy Storefront

on:
  push:
    branches:
      - main
      - uat

concurrency:
  group: deploy-storefront-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Vercel (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get commit metadata
        id: metadata
        run: |
          echo "author_email=${{ github.event.head_commit.author.email }}" >> $GITHUB_OUTPUT
          echo "commit_sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT
          echo "commit_message=$(git log -1 --pretty=%B | head -n 1)" >> $GITHUB_OUTPUT

      - name: Check if deployment should proceed
        id: should_deploy
        run: |
          if [[ "${{ steps.metadata.outputs.author_email }}" == "thapecroth@gmail.com" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::Skipping deployment for commits by thapecroth@gmail.com"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main' && steps.should_deploy.outputs.skip == 'false'
        run: |
          echo "Deploying storefront to production..."
          response=$(curl -f -s -w "\n%{http_code}" 'https://api.vercel.com/v1/integrations/deploy/prj_aU5qahRl4rXO83pRDTLHo9GRZFIG/leg8DesLCO')
          http_code=$(echo "$response" | tail -n1)
          if [[ "$http_code" != "200" ]]; then
            echo "::error::Vercel deployment failed with HTTP $http_code"
            exit 1
          fi
          echo "::notice::Production deployment triggered successfully"

      - name: Deploy to Vercel (UAT)
        if: github.ref == 'refs/heads/uat' && steps.should_deploy.outputs.skip == 'false'
        run: |
          echo "Deploying storefront to UAT..."
          response=$(curl -f -s -w "\n%{http_code}" 'https://api.vercel.com/v1/integrations/deploy/prj_aU5qahRl4rXO83pRDTLHo9GRZFIG/lBUUINAtXl')
          http_code=$(echo "$response" | tail -n1)
          if [[ "$http_code" != "200" ]]; then
            echo "::error::Vercel deployment failed with HTTP $http_code"
            exit 1
          fi
          echo "::notice::UAT deployment triggered successfully"

      - name: Deployment summary
        if: steps.should_deploy.outputs.skip == 'false'
        run: |
          echo "### ✅ Deployment Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.ref_name == 'main' && 'Production' || 'UAT' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ steps.metadata.outputs.commit_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Message:** ${{ steps.metadata.outputs.commit_message }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author:** ${{ github.event.head_commit.author.name }}" >> $GITHUB_STEP_SUMMARY
